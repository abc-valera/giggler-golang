name: giggler-golang-local
services:
  # INFRASTRUCTURE SERVICES
  # TODO: add grafana loki
  # TODO: add grafana tempo
  # TODO: add prometheus
  db:
    image: postgres:trixie
    env_file:
      - path: ../../secrets/local.env
        required: true
    ports:
      - "5432:5432" # Expose Postgres port for local debugging and testing
    volumes:
      # TODO: define a release-db volume
      - /var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

  # APPLICATION
  webapi:
    build:
      args:
        WORKDIR_PATH: ${PWD}
        GIGGLER_GOLANG_VERSION: ${GIGGLER_GOLANG_VERSION}
    env_file:
      - path: ../../secrets/local.env
        required: true
    ports:
      - "${GIGGLER_WEBAPI_PORT:-8080}:${GIGGLER_WEBAPI_PORT:-8080}"
    volumes:
      # TODO: define a named local-webapi volume
      - ${PWD}/var:${PWD}/var
      - ${PWD}/build:${PWD}/build
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${GIGGLER_WEBAPI_PORT:-8080}/build-version",
        ]
      start_period: 5s
      interval: 1s
      timeout: 1s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # CONSUMER SERVICES
  grafana:
    image: grafana/grafana-oss
    env_file:
      - path: ../../secrets/local.env
        required: true
    environment:
      - GF_LOG_LEVEL=error
    # if you are running as root then set it to 0
    # else find the right id with the id -u command
    user: "0"
    ports:
      - "${GRAFANA_PORT:-8091}:3000"
    volumes:
      # TODO: define a named grafana volume
      - /var/lib/grafana
    restart: always
    depends_on:
      webapi:
        condition: service_healthy
