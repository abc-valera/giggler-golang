name: giggler-golang-local
services:
  # INFRASTRUCTURE SERVICES
  db:
    image: postgres:trixie
    env_file:
      - path: ../../secrets/local.env
        required: true
    ports:
      - "5432:5432" # Expose Postgres port for local debugging and testing
    volumes:
      - db-data:/var/lib/postgresql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 10

  # APPLICATION
  webapi:
    build:
      args:
        WORKDIR_PATH: ${PWD}
        GIGGLER_GOLANG_VERSION: ${GIGGLER_GOLANG_VERSION}
    env_file:
      - path: ../../secrets/local.env
        required: true
    ports:
      - "${GIGGLER_WEBAPI_PORT:-8080}:${GIGGLER_WEBAPI_PORT:-8080}"
    volumes:
      # TODO: define a named local-webapi volume
      - ${PWD}/var:${PWD}/var
      - ${PWD}/build:${PWD}/build
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${GIGGLER_WEBAPI_PORT:-8080}/build-version",
        ]
      start_period: 5s
      interval: 1s
      timeout: 1s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  # CONSUMER SERVICES
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: always

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    restart: always

  tempo:
    image: grafana/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: always

  pyroscope:
    image: grafana/pyroscope
    ports:
      - "4040:4040"
    volumes:
      - pyroscope-data:/data
    restart: always

  alloy:
    image: grafana/alloy
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    ports:
      - "12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    depends_on:
      - loki
      - pyroscope

  grafana:
    image: grafana/grafana-oss
    env_file:
      - path: ../../secrets/local.env
        required: true
    environment:
      - GF_LOG_LEVEL=error
    # if you are running as root then set it to 0
    # else find the right id with the id -u command
    user: "0"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: always
    depends_on:
      webapi:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      pyroscope:
        condition: service_started

volumes:
  db-data: {}
  prometheus-data: {}
  loki-data: {}
  tempo-data: {}
  pyroscope-data: {}
  grafana-data: {}
